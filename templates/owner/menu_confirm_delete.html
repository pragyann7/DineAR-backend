{% extends 'base.html' %}

{% block title %}Delete Item | DineAR{% endblock %}
{% block header %}Confirm Deletion{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8 mt-12">
    <div class="text-center mb-6">
        <i class="fas fa-trash-alt fa-4x text-red-500 mb-4"></i>
        <h2 class="text-2xl font-bold text-gray-800">Remove from Menu?</h2>
        <p class="text-gray-600 mt-2">Are you sure you want to delete <strong>{{ object.name }}</strong>? This action cannot be undone.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="flex flex-col space-y-3">
            <button type="submit" class="bg-red-600 text-white px-6 py-3 rounded-full font-bold hover:bg-red-700 transition">
                Yes, Delete Item
            </button>
            <a href="{% url 'menu_item_list' %}" class="bg-gray-100 text-gray-600 px-6 py-3 rounded-full font-bold text-center hover:bg-gray-200 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
