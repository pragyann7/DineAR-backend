<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DineAR Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar-item-active {
            background-color: #f45905;
            color: white;
        }
        .text-dinear-orange {
            color: #f45905;
        }
        .bg-dinear-orange {
            background-color: #f45905;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

<div class="flex flex-col md:flex-row">
    <!-- Sidebar -->
    <div class="bg-white shadow-xl h-16 fixed bottom-0 md:relative md:h-screen z-10 w-full md:w-64">
        <div class="md:mt-12 md:w-64 md:fixed md:left-0 md:top-0 content-center md:content-start text-left justify-between">
            <div class="p-6 text-center hidden md:block">
                <h1 class="text-2xl font-bold text-dinear-orange">DineAR</h1>
                <p class="text-xs text-gray-500 uppercase tracking-wider">Management Console</p>
            </div>

            <ul class="list-reset flex flex-row md:flex-col py-0 md:py-3 px-1 md:px-2 text-center md:text-left">
                {% if user.is_superuser %}
                <li class="mr-3 flex-1">
                    <a href="{% url 'admin_dashboard' %}" class="block py-1 md:py-3 pl-1 align-middle text-gray-600 no-underline hover:text-dinear-orange border-b-2 border-transparent hover:border-dinear-orange">
                        <i class="fas fa-chart-line pr-0 md:pr-3"></i><span class="pb-1 md:pb-0 text-xs md:text-base text-gray-600 md:text-gray-400 block md:inline-block">Admin Overview</span>
                    </a>
                </li>
                <li class="mr-3 flex-1">
                    <a href="/admin/" class="block py-1 md:py-3 pl-1 align-middle text-gray-600 no-underline hover:text-dinear-orange border-b-2 border-transparent hover:border-dinear-orange">
                        <i class="fas fa-users-cog pr-0 md:pr-3"></i><span class="pb-1 md:pb-0 text-xs md:text-base text-gray-600 md:text-gray-400 block md:inline-block">System Admin</span>
                    </a>
                </li>
                {% elif user.is_restaurant_owner %}
                <li class="mr-3 flex-1">
                    <a href="{% url 'owner_dashboard' %}" class="block py-1 md:py-3 pl-1 align-middle text-gray-600 no-underline hover:text-dinear-orange border-b-2 border-transparent hover:border-dinear-orange">
                        <i class="fas fa-utensils pr-0 md:pr-3"></i><span class="pb-1 md:pb-0 text-xs md:text-base text-gray-600 md:text-gray-400 block md:inline-block">My Restaurant</span>
                    </a>
                </li>
                <li class="mr-3 flex-1">
                    <a href="{% url 'menu_item_list' %}" class="block py-1 md:py-3 pl-1 align-middle text-gray-600 no-underline hover:text-dinear-orange border-b-2 border-transparent hover:border-dinear-orange">
                        <i class="fas fa-list pr-0 md:pr-3"></i><span class="pb-1 md:pb-0 text-xs md:text-base text-gray-600 md:text-gray-400 block md:inline-block">Menu Management</span>
                    </a>
                </li>
                {% endif %}

                <li class="mr-3 flex-1">
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-left py-1 md:py-3 pl-1 align-middle text-gray-600 no-underline hover:text-red-600 border-b-2 border-transparent hover:border-red-600">
                            <i class="fas fa-sign-out-alt pr-0 md:pr-3"></i><span class="pb-1 md:pb-0 text-xs md:text-base text-gray-600 md:text-gray-400 block md:inline-block">Logout</span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content flex-1 bg-gray-100 mt-12 md:mt-2 pb-24 md:pb-5">
        <div class="bg-dinear-orange pt-3">
            <div class="rounded-tl-3xl bg-gradient-to-r from-orange-600 to-orange-400 p-4 shadow text-2xl text-white">
                <h3 class="font-bold pl-2">{% block header %}Dashboard{% endblock %}</h3>
            </div>
        </div>

        <div class="p-6">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>

</body>
</html>
